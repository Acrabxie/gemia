name: Render 1.25x Lumeri README animation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  render:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render 1.25x GIF
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/${{ github.repository }}/main/docs/assets/lumeri-working.gif \
            --output /tmp/lumeri-working-source.gif
          ffmpeg -hide_banner -loglevel error -y \
            -i /tmp/lumeri-working-source.gif \
            -filter_complex "[0:v]setpts=PTS*1.2,fps=30,split[s0][s1];[s0]palettegen=reserve_transparent=1:stats_mode=diff[p];[s1][p]paletteuse=dither=sierra2_4a:alpha_threshold=128" \
            -loop 0 docs/assets/lumeri-working.gif
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,nb_frames,duration \
            -of default=noprint_wrappers=1 docs/assets/lumeri-working.gif

      - name: Commit the generated GIF and remove this workflow
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/render-lumeri-readme-animation-1-25x.yml
          git add docs/assets/lumeri-working.gif
          git commit -m "Set Lumeri README animation to 1.25x speed"
          git push origin "HEAD:${PR_BRANCH}"
