name: Windows 7788

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-7788-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-7788:
    name: Windows 7788 source runtime
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          # Chocolatey updates the current shell but does not reliably persist
          # its shim directory to the next GitHub Actions step.
          $chocoBin = Join-Path $env:ChocolateyInstall "bin"
          $chocoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path += ";$chocoBin"
          Get-Command ffmpeg -ErrorAction Stop
          Get-Command ffprobe -ErrorAction Stop
      - name: Run the documented Windows setup
        shell: pwsh
        run: |
          .\scripts\windows\setup.ps1
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
      - name: Check Python syntax
        run: .\.venv\Scripts\python.exe -m compileall -q gemia lumerai lumenframe server.py
      - name: Run full test suite on Windows
        run: .\.venv\Scripts\python.exe -m pytest tests/ -q -rs
      - name: Start and probe port 7788
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "lumeri-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "lumeri-stderr.log"
          $proc = Start-Process pwsh -ArgumentList @("-NoLogo", "-NoProfile", "-File", ".\scripts\windows\start.ps1", "-NoBrowser", "-Port", "7788") -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:7788/health" -TimeoutSec 2
                if ($health.status -eq "ok") { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) {
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw "Lumeri did not become healthy on port 7788."
            }

            $workspaceResponse = Invoke-WebRequest -Uri "http://127.0.0.1:7788/" -UseBasicParsing
            if ($workspaceResponse.StatusCode -ne 200 -or $workspaceResponse.Content -notmatch "Lumeri") {
              throw "The browser workspace did not load from port 7788."
            }

            $accountStatus = 0
            try {
              $accountStatus = (Invoke-WebRequest -Uri "http://127.0.0.1:7788/auth/session" -UseBasicParsing -ErrorAction Stop).StatusCode
            } catch {
              if ($null -ne $_.Exception.Response) {
                $accountStatus = [int]$_.Exception.Response.StatusCode
              } else {
                throw
              }
            }
            if ($accountStatus -ne 404) {
              throw "The removed account endpoint returned HTTP $accountStatus instead of 404."
            }

            $sandbox = Invoke-RestMethod -Uri "http://127.0.0.1:7788/settings/sandbox" -TimeoutSec 5
            if ($sandbox.host_platform -ne "windows" -or $sandbox.sandbox_available -ne $false -or $sandbox.code_execution_available -ne $false) {
              throw "Windows must report model-generated code execution as locked while its native sandbox is unavailable."
            }

            $edgeCandidates = @(
              (Join-Path $env:ProgramFiles "Microsoft\Edge\Application\msedge.exe"),
              (Join-Path ${env:ProgramFiles(x86)} "Microsoft\Edge\Application\msedge.exe"),
              (Get-Command msedge.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue)
            ) | Where-Object { $_ -and (Test-Path $_) }
            $edge = $edgeCandidates | Select-Object -First 1
            if (-not $edge) { throw "Microsoft Edge was not found on the Windows runner." }

            $edgeProfile = Join-Path $env:RUNNER_TEMP "lumeri-edge-profile"
            $edgeDom = Join-Path $env:RUNNER_TEMP "lumeri-edge-dom.html"
            $edgeStderr = Join-Path $env:RUNNER_TEMP "lumeri-edge-stderr.log"
            $edgeArgs = @(
              "--headless",
              "--disable-gpu",
              "--no-first-run",
              "--disable-features=OptimizationGuideModelDownloading,OptimizationHints",
              "--user-data-dir=$edgeProfile",
              "--virtual-time-budget=5000",
              "--dump-dom",
              "http://127.0.0.1:7788/"
            )
            # Start-Process -Wait follows Edge's whole child-process tree. The
            # workspace keeps an SSE connection open, so that tree can outlive
            # the one-shot --dump-dom browser process indefinitely. Wait only
            # for the process we launched and keep CI bounded.
            $edgeProc = Start-Process -FilePath $edge -ArgumentList $edgeArgs -PassThru -RedirectStandardOutput $edgeDom -RedirectStandardError $edgeStderr
            if (-not $edgeProc.WaitForExit(45000)) {
              Stop-Process -Id $edgeProc.Id -Force -ErrorAction SilentlyContinue
              throw "Microsoft Edge did not finish rendering the Windows workspace within 45 seconds."
            }
            if ($edgeProc.ExitCode -ne 0) {
              Get-Content $edgeStderr -ErrorAction SilentlyContinue
              throw "Microsoft Edge failed while rendering the Windows workspace."
            }
            $renderedText = Get-Content $edgeDom -Raw -ErrorAction SilentlyContinue
            $workspaceMarkers = @("预览", "大纲", "后台任务", "时间线", "Projects", "Ctrl\+Z")
            foreach ($marker in $workspaceMarkers) {
              if ($renderedText -notmatch $marker) {
                throw "The rendered Windows workspace is missing its current '$marker' surface."
              }
            }
            if ($renderedText -match "登录|注册|退出账号|账户中心") {
              throw "The rendered public workspace still exposes an account surface."
            }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
