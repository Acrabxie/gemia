<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lumeri Video</title>
<link rel="icon" type="image/svg+xml" href="/v3/lumeri-favicon.svg" />
<link rel="stylesheet" href="/v3/v3.css" />
</head>
<body>
<header class="app-header" id="app-header">
  <span class="brand">
    <img class="brand-logo" src="/v3/lumeri-mark.svg" alt="Lumeri" width="26" height="19" />
    <h1>Lumeri Video</h1>
  </span>
</header>

<main class="app-main" id="app-main">
  <!-- LEFT · modular editing desk: preview + side modules + shared timeline -->
  <section class="preview-stage" id="preview-stage">
    <div class="stage-tabbar" id="stage-tabs" role="tablist" aria-label="工作区视图">
      <div class="stage-tab-list" id="stage-tab-list"></div>
      <button type="button" id="stage-add-btn" class="stage-add-btn" title="添加视图" aria-label="添加视图" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plus"/></svg>
      </button>
      <span class="stage-tabbar-spacer"></span>
      <button type="button" id="stage-overflow-btn" class="stage-add-btn" title="更多" aria-label="更多操作" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-more"/></svg>
      </button>
      <div id="stage-add-menu" class="stage-add-menu" hidden role="menu" aria-label="添加视图"></div>
      <div id="stage-overflow-menu" class="stage-add-menu stage-overflow-menu" hidden role="menu" aria-label="更多操作"></div>
    </div>

    <div class="workspace-board" id="workspace-board">
      <section class="workspace-module workspace-preview-module" data-workspace-module="preview" aria-labelledby="preview-module-title">
        <div class="workspace-module-head" data-module-drag="preview" draggable="true">
          <svg class="module-drag-grip" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-grip"/></svg>
          <span class="workspace-module-title" id="preview-module-title">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="12" rx="2.5"/><path d="M10.4 8.6l3.8 2.4-3.8 2.4z"/></svg>
            <span class="label">预览</span>
          </span>
          <span class="workspace-module-meta">时间线播放</span>
        </div>

        <div class="empty-state" id="empty-state">
          <img class="empty-mark" src="/v3/lumeri-mark.svg" alt="Lumeri" width="92" height="66" />
          <h2 class="empty-title">开始创作</h2>
          <p class="empty-sub">在右侧描述你想要的视频</p>
        </div>

        <div class="stage-scroll" id="stage-scroll">
          <section class="delivery-review-master" id="delivery-review-master" aria-label="正式审片母版" hidden>
            <video id="delivery-review-video" controls preload="metadata" playsinline></video>
          </section>
          <p class="timeline-preview-empty" id="timeline-preview-empty">时间线暂无可播放内容</p>
          <div class="asset-grid" id="asset-grid" hidden></div>
        </div>
        <div class="module-resize-edge module-resize-edge-x" data-module-resize="preview" data-resize-axis="x" role="separator" tabindex="0" aria-label="调整预览宽度"></div>
        <div class="module-resize-edge module-resize-edge-y" data-module-resize="preview" data-resize-axis="y" role="separator" tabindex="0" aria-label="调整预览高度"></div>
        <div class="module-resize-edge module-resize-corner" data-module-resize="preview" data-resize-axis="both" role="separator" tabindex="0" aria-label="同时调整预览宽度和高度"></div>
      </section>

      <!-- outline / tasks / files / history are rendered here simultaneously -->
      <aside class="stage-panel" id="stage-panel" aria-label="工作区模块" hidden></aside>

      <!-- Timeline is a first-class workspace module, packed by the same no-overlap algorithm. -->
      <section class="workspace-module workspace-timeline-module timeline-drawer" id="timeline-drawer" data-workspace-module="timeline" aria-labelledby="timeline-module-title">
        <div class="workspace-module-head" data-module-drag="timeline" draggable="true">
          <svg class="module-drag-grip" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-grip"/></svg>
          <span class="workspace-module-title" id="timeline-module-title">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4M9 7v10M13 9v6M17 6v12M21 10v4"/></svg>
            <span class="label">时间线</span>
          </span>
          <span class="workspace-module-meta">轨道编辑</span>
          <button type="button" class="workspace-module-close" data-module-close="timeline" title="隐藏时间线" aria-label="隐藏时间线"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"/></svg></button>
        </div>
        <div class="timeline-module-body"><section id="project-timeline-panel" class="ptl"></section></div>
        <div class="module-resize-edge module-resize-edge-x" data-module-resize="timeline" data-resize-axis="x" role="separator" tabindex="0" aria-label="调整时间线宽度"></div>
        <div class="module-resize-edge module-resize-edge-y" data-module-resize="timeline" data-resize-axis="y" role="separator" tabindex="0" aria-label="调整时间线高度"></div>
        <div class="module-resize-edge module-resize-corner" data-module-resize="timeline" data-resize-axis="both" role="separator" tabindex="0" aria-label="同时调整时间线宽度和高度"></div>
      </section>
    </div>
  </section>

  <!-- RIGHT · chat rail: session head, history, cohesive input -->
  <aside class="chat-rail" id="chat-rail">
    <div class="rail-head">
      <!-- connection dot + session id kept for JS wiring but no longer shown (user request) -->
      <span class="status-pill" id="connection-pill" role="status" title="offline" aria-label="offline" hidden></span>
      <span class="session-id" id="session-id-label" hidden>—</span>
      <button type="button" id="project-btn" class="project-btn" title="收起 Projects 与会话" aria-label="收起 Projects 与会话" aria-controls="project-sidebar" aria-expanded="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-folder"/></svg>
        <span id="project-name-label">Project</span>
      </button>
      <span class="rail-head-spacer"></span>
      <button type="button" class="rail-btn icon-btn" id="setup-btn" title="AI 供应商设置" aria-label="AI 供应商设置"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sliders"/></svg></button>
    </div>

    <!-- Durable production truth. Hidden for legacy/chat-only sessions only
         when there is genuinely no production run to report. -->
    <section class="production-strip" id="production-strip" aria-live="polite" hidden>
      <div class="production-summary">
        <span class="production-state" id="production-state-label">尚未开始生产</span>
        <span class="production-revision" id="production-revision-label">r0</span>
        <span class="production-budget" id="production-budget-label">$0.00 / $15.00</span>
      </div>
      <div class="production-mix" id="production-mix-label" hidden></div>
      <div class="production-blockers" id="production-blockers" hidden></div>
      <div class="production-review" id="production-review" hidden>
        <div class="production-review-range">
          <label>从 <input id="review-start-sec" type="number" min="0" step="0.1" inputmode="decimal" placeholder="秒" /></label>
          <label>到 <input id="review-end-sec" type="number" min="0" step="0.1" inputmode="decimal" placeholder="秒" /></label>
        </div>
        <textarea id="review-note" rows="2" placeholder="写下要修改的内容；填写时间可只返修这一段"></textarea>
        <fieldset class="production-approval-checks" id="production-approval-checks">
          <legend>只有完整观看后才能确认发布</legend>
          <label class="review-watch-confirm"><input id="review-watched-full-video" type="checkbox" /> 已按正常速度完整观看 120 秒</label>
          <div class="review-creative-checks" aria-label="人工创作验收">
            <label><input type="checkbox" data-review-dimension="story" />叙事</label>
            <label><input type="checkbox" data-review-dimension="pacing" />节奏</label>
            <label><input type="checkbox" data-review-dimension="visual" />视觉</label>
            <label><input type="checkbox" data-review-dimension="sound" />声音</label>
            <label><input type="checkbox" data-review-dimension="publishable" />可发布</label>
          </div>
        </fieldset>
        <div class="production-review-actions">
          <button type="button" id="request-changes-btn" class="review-secondary">要求修改</button>
          <button type="button" id="approve-production-btn" class="review-primary">可以发布</button>
        </div>
        <span class="production-review-status" id="production-review-status" role="status"></span>
      </div>
    </section>

    <div class="rail-history-shell">
      <div class="rail-history" id="rail-history">
        <div class="timeline" id="timeline" hidden></div>
        <div class="rail-empty" id="rail-empty">
          <p class="rail-empty-hint">试试这样开始</p>
          <button type="button" class="suggest-chip" data-suggest="做一支 30 秒的产品宣传片，冰蓝色调，节奏干净利落">30 秒产品宣传片</button>
          <button type="button" class="suggest-chip" data-suggest="把素材库里的视频剪成 15 秒竖版短片">剪一支 15 秒竖版</button>
          <button type="button" class="suggest-chip" data-suggest="给当前成片配上中文字幕">给成片配中文字幕</button>
          <button type="button" class="suggest-chip" data-suggest="从素材里找出最好的三个镜头，拼成一段预览">挑出最好的镜头</button>
        </div>
      </div>
      <button type="button" id="chat-scroll-bottom" class="chat-scroll-bottom" title="滚动到底部" aria-label="滚动到底部" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron-d"/></svg>
      </button>
    </div>

    <!-- plan approval bar: filled by v3.js while plan mode is on -->
    <div id="plan-bar" class="plan-bar" hidden></div>

    <!-- ask dock: rendered by v3.js when elicit awaits a user answer -->
    <div id="ask-dock" class="ask-dock" hidden></div>

    <!-- cohesive input shell: one piece, two states (collapsed pill ↔ grown card) -->
    <footer class="composer input-shell" id="input-shell">
      <!-- slash-command palette (unchanged behavior), anchored to the shell -->
      <div id="slash-menu" class="slash-menu" hidden></div>

      <!-- "+" popover: the single entry point for everything -->
      <div id="plus-menu" class="plus-menu" hidden role="menu" aria-label="添加">
        <button type="button" id="upload-btn" class="plus-item" role="menuitem">
          <svg class="plus-ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-attach"/></svg>
          <span class="plus-label">上传</span>
          <span class="plus-tail" id="upload-shortcut-label">Ctrl+U</span>
        </button>
        <button type="button" class="plus-item" data-plus="slash" role="menuitem">
          <svg class="plus-ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-slash"/></svg>
          <span class="plus-label">快捷指令</span>
          <span class="plus-tail">/</span>
        </button>

        <div class="plus-divider" role="separator"></div>
        <div class="plus-item plus-switch" data-plus="plan" role="menuitemcheckbox" aria-checked="false" tabindex="0">
          <svg class="plus-ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-list-check"/></svg>
          <span class="plus-label">计划模式</span>
          <button type="button" id="plan-toggle-btn" class="plan-toggle switch" title="计划模式：只查看和规划，批准后才执行改动">计划</button>
        </div>
        <div class="plus-item plus-switch" data-plus="sandbox" role="menuitemcheckbox" aria-checked="true" tabindex="0">
          <svg class="plus-ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-shield"/></svg>
          <span class="plus-label">沙盒</span>
          <button type="button" id="sandbox-toggle-btn" class="sandbox-toggle switch" title="沙盒已开启（点击关闭）">沙盒</button>
        </div>

        <div class="plus-divider" role="separator"></div>
        <button type="button" class="plus-item" data-plus="assets" role="menuitem">
          <svg class="plus-ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-grid"/></svg>
          <span class="plus-label">素材库</span>
          <span class="plus-tail">›</span>
        </button>
      </div>

      <input type="file" id="upload-input" multiple hidden />
      <button type="button" id="plus-btn" class="plus-btn" aria-haspopup="menu" aria-expanded="false" title="添加" aria-label="添加">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plus"/></svg>
      </button>
      <textarea
        id="prompt-input"
        rows="1"
        placeholder="描述你想要的视频，或输入 / 唤起命令…"
      ></textarea>
      <div class="composer-actions">
        <button type="button" id="send-btn" class="send-btn" disabled aria-label="语音输入" title="语音输入">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-mic"/></svg>
        </button>
      </div>
      <span id="voice-input-status" class="voice-input-status" role="status" aria-live="polite" hidden></span>
    </footer>
  </aside>

  <!-- Persistent right-side Project navigation: projects own their sessions. -->
  <aside class="project-sidebar" id="project-sidebar" aria-label="Projects 与会话">
    <div class="project-sidebar-head">
      <span class="project-sidebar-title">Projects</span>
      <span class="project-sidebar-spacer"></span>
      <button type="button" id="new-project-btn" class="project-sidebar-action icon-btn" title="新建 Project" aria-label="新建 Project"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-folder-plus"/></svg></button>
      <button type="button" id="new-session-btn" class="project-sidebar-action icon-btn" title="新会话" aria-label="新会话"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-new-chat"/></svg></button>
    </div>
    <div class="project-sidebar-body" id="project-sidebar-body" aria-live="polite">
      <p class="project-sidebar-placeholder">正在载入 Projects…</p>
    </div>
  </aside>

</main>

<!-- Assets tray: media and non-media project assets -->
<div id="assets-tray" class="assets-tray" hidden>
  <div class="assets-tray-panel">
    <div class="assets-tray-head">
      <h2 class="pane-heading">素材库</h2>
      <div class="assets-tray-actions">
        <button type="button" id="library-refresh-btn" class="library-small-btn icon-btn" title="刷新" aria-label="刷新"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-refresh"/></svg></button>
        <button type="button" id="library-roughcut-btn" class="library-small-btn icon-btn" title="粗剪准备" aria-label="粗剪准备"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-wand"/></svg></button>
        <button type="button" id="library-annotate-btn" class="library-small-btn icon-btn" title="标注视频" aria-label="标注视频"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-wand"/></svg></button>
        <button type="button" id="assets-tray-close" class="library-small-btn icon-btn" title="关闭" aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"/></svg></button>
      </div>
    </div>
    <div class="library-sections" role="tablist" aria-label="素材类型">
      <button type="button" class="library-section active" role="tab" aria-selected="true" data-library-section="media">媒体素材</button>
      <button type="button" class="library-section" role="tab" aria-selected="false" data-library-section="non-media">非媒体素材</button>
    </div>
    <div id="roughcut-job-status" class="roughcut-job-status" role="status" aria-live="polite" hidden></div>
    <div class="media-library-grid" id="media-library-grid">
      <p class="placeholder">暂无素材</p>
    </div>
  </div>
</div>

<script src="/v3/workspace-layout.js" defer></script>
<script src="/v3/api-client.js" defer></script>
<script src="/v3/v3.js" defer></script>
</body>
</html>
